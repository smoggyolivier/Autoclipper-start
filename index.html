<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AutoClipper"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icoon180.png"><meta name="theme-color" content="#16a34a">
<title>AutoClipper</title>
<style>
:root{--bg:#16a34a;--tekst:#fff}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tekst);
font:18px/1.5 -apple-system,system-ui,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
button{margin-top:16px;padding:12px 20px;border-radius:10px;border:0;font:inherit;font-weight:600;color:#16a34a;background:#fff}
</style></head><body><div><div id="t">Even laden…</div><button id="k" hidden onclick="location.reload()">Opnieuw proberen</button></div>
<script>
(function(){
  var t=document.getElementById('t'),k=document.getElementById('k');
  var kanaal=(location.hash||'').slice(1);
  try{ if(kanaal) localStorage.setItem('k',kanaal); else kanaal=localStorage.getItem('k')||''; }catch(e){}
  if(!/^[A-Za-z0-9_-]{16,64}$/.test(kanaal)){ t.textContent='Deze pagina werkt alleen met je eigen link.'; return; }
  var patroon=/^https:\/\/(?!api\.)[a-z0-9-]+\.trycloudflare\.com\/[A-Za-z0-9_-]+$/;
  function viaNtfy(){
    return fetch('https://ntfy.sh/'+kanaal+'/json?poll=1&since=all').then(function(r){return r.text();}).then(function(tekst){
      var beste=null;
      tekst.split('\n').forEach(function(r){ try{ var m=JSON.parse(r); if(m.event==='message'&&patroon.test(m.message)) beste={t:m.time,l:m.message}; }catch(e){} });
      return beste;
    }).catch(function(){return null;});
  }
  function sha(s){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); }
  function hex(b){ return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join(''); }
  function bytes(s){ return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}); }
  function viaGithub(){   // tweede route: de link staat versleuteld naast deze pagina (sleutel = jouw geheime kanaal)
    if(!window.crypto||!crypto.subtle) return Promise.resolve(null);
    return sha('naam:'+kanaal).then(function(h){ return fetch('l/'+hex(h).slice(0,32)+'.json?'+Date.now(),{cache:'no-store'}); })
      .then(function(r){ return r.ok?r.json():null; }).then(function(d){
        if(!d) return null;
        return sha('sleutel:'+kanaal).then(function(kb){ return crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']); })
          .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(d.iv)},key,bytes(d.ct)); })
          .then(function(pt){ var l=new TextDecoder().decode(pt); return patroon.test(l)?{t:d.t,l:l}:null; });
      }).catch(function(){return null;});
  }
  Promise.all([viaNtfy(),viaGithub()]).then(function(r){
    var beste=null; r.forEach(function(x){ if(x&&(!beste||x.t>beste.t)) beste=x; });
    if(beste){ location.replace(beste.l); } else { t.textContent='Je overzicht is even niet bereikbaar. Probeer het over een paar minuten opnieuw.'; k.hidden=false; }
  });
})();
</script></body></html>
