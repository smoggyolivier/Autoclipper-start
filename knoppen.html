<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#16a34a">
<title>AutoClipper</title>
<style>
:root{--bg:#16a34a;--tekst:#fff;--knop:#fff;--knoptekst:#16a34a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f5f2c}}
:root[data-theme="dark"]{--bg:#0f5f2c}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tekst);font:18px/1.45 -apple-system,system-ui,sans-serif;
padding:24px 16px;box-sizing:border-box}
main{max-width:520px;margin:0 auto}
h1{font-size:21px;margin:0 0 10px}
p{margin:0 0 18px;white-space:pre-line;opacity:.95}
a.knop{display:block;margin:0 0 14px;padding:16px 18px;border-radius:14px;background:var(--knop);color:var(--knoptekst);
font-weight:700;text-decoration:none;text-align:center;font-size:19px}
</style></head><body><main id="m">Even laden…</main>
<script>
(function(){
  var m=document.getElementById('m');
  try{
    var h=(location.hash||'').slice(1).replace(/-/g,'+').replace(/_/g,'/');
    while(h.length%4) h+='=';
    var d=JSON.parse(decodeURIComponent(escape(atob(h))));
    m.textContent='';
    var t=document.createElement('h1'); t.textContent=d.t||'AutoClipper'; m.appendChild(t);
    if(d.r){ var p=document.createElement('p'); p.textContent=d.r; m.appendChild(p); }
    (d.a||[]).forEach(function(x){
      if(!/^(https|shortcuts|googlechrome|googleapp|x-safari-https):/.test(x[1])) return;
      var a=document.createElement('a'); a.className='knop'; a.href=x[1]; a.textContent=x[0]; m.appendChild(a);
    });
  }catch(e){ m.textContent='Deze knoppen konden niet geladen worden.'; }
})();
</script></body></html>
